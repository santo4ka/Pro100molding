<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отзывы — PRO100MOLDING</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&display=swap" rel="stylesheet">

<style>
:root{--gold:#c5a059;--dark:#1a1a1a;--light:#f4f4f4}
body{margin:0;font-family:'Montserrat',sans-serif;background:var(--light)}

header{
  height:220px;
  background:url('https://images.unsplash.com/photo-1513694203232-719a280e022f') center/cover;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  border-bottom:5px solid var(--gold);
}
header::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
header h1{position:relative;color:#fff;letter-spacing:2px}

main{max-width:1200px;margin:-40px auto 40px;padding:0 15px}

.layout{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}

.reviews,.form{
  background:#fff;
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.1);
  border-top:5px solid var(--gold);
  padding:20px;
}

.review{border-bottom:1px solid #eee;padding:15px 0}
.review:last-child{border:none}
.review-name{font-weight:700;font-size:.9rem}
.review-date{font-size:.7rem;color:#888}
.review-text{font-size:.8rem;margin-top:6px}

.review img{
  margin-top:10px;
  max-width:100%;
  border-radius:8px;
}

input,textarea,button{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  font-family:inherit;
  font-size:.8rem;
  border-radius:6px;
  border:1px solid #ccc;
}

button{
  background:var(--gold);
  color:#fff;
  border:none;
  font-weight:700;
  cursor:pointer;
}
button:hover{background:var(--dark)}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header><h1>Отзывы клиентов</h1></header>

<main>
<div class="layout">

<div class="reviews" id="reviews"></div>

<div class="form">
  <h3>Оставить отзыв</h3>
  <input id="name" placeholder="Ваше имя">
  <textarea id="text" placeholder="Ваш отзыв"></textarea>
  <input type="file" id="file">
  <button onclick="addReview()">Отправить</button>
</div>

</div>
</main>
