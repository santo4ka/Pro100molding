<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отзывы</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .review-form {
      max-width: 600px;
      margin: 0 auto 40px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
    }

    .review-form input,
    .review-form textarea {
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 16px;
    }

    .review-form button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .reviews {
      max-width: 800px;
      margin: 0 auto;
    }

    .review {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .review img,
    .review video {
      max-width: 100%;
      margin-top: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<h1>Отзывы клиентов</h1>

<div class="review-form">
  <input type="text" id="name" placeholder="Ваше имя">
  <textarea id="text" placeholder="Ваш отзыв"></textarea>
  <input type="file" id="media" accept="image/*,video/*">
  <button id="send">Отправить отзыв</button>
</div>

<div class="reviews" id="reviews"></div>

<script>
const reviewsBox = document.getElementById('reviews');
const sendBtn = document.getElementById('send');

let reviews = JSON.parse(localStorage.getItem('reviews')) || [];

function renderReviews() {
  reviewsBox.innerHTML = '';
  reviews.forEach(r => {
    const div = document.createElement('div');
    div.className = 'review';
    div.innerHTML = `<strong>${r.name}</strong><p>${r.text}</p>`;

    if (r.media) {
      if (r.media.type.startsWith('image')) {
        const img = document.createElement('img');
        img.src = r.media.src;
        div.appendChild(img);
      } else {
        const video = document.createElement('video');
        video.src = r.media.src;
        video.controls = true;
        div.appendChild(video);
      }
    }

    reviewsBox.appendChild(div);
  });
}

sendBtn.onclick = () => {
  const name = document.getElementById('name').value.trim();
  const text = document.getElementById('text').value.trim();
  const file = document.getElementById('media').files[0];

  if (!name || !text) return;

  if (file) {
    const reader = new FileReader();
    reader.onload = () => {
      reviews.unshift({
        name,
        text,
        media: { src: reader.result, type: file.type }
      });
      localStorage.setItem('reviews', JSON.stringify(reviews));
      renderReviews();
    };
    reader.readAsDataURL(file);
  } else {
    reviews.unshift({ name, text });
    localStorage.setItem('reviews', JSON.stringify(reviews));
    renderReviews();
  }
};

renderReviews();
</script>

</body>
</html>
