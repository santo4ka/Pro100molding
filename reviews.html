<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отзывы клиентов — PRO100MOLDING</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&display=swap" rel="stylesheet">

<style>
:root{--gold:#c5a059;--dark:#1a1a1a;--light:#f4f4f4}

body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:var(--light);
  color:#333;
}

/* HEADER */
.site-header{
  position:relative;
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&q=80&w=1200') center/cover;
  border-bottom:5px solid var(--gold);
}
.site-header::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.55);
}
.site-header h1{
  position:relative;
  z-index:2;
  font-size:clamp(1.6rem,5vw,3rem);
  text-transform:uppercase;
  letter-spacing:2px;
}

/* MAIN */
main{
  max-width:1200px;
  margin:-40px auto 50px;
  padding:0 15px;
  position:relative;
  z-index:5;
}

.reviews-layout{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}

/* REVIEWS LIST */
.reviews-box{
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  border-top:5px solid var(--gold);
}
.review{
  border-bottom:1px solid #eee;
  padding:14px 0;
}
.review:last-child{border-bottom:none}
.review-name{
  font-weight:700;
  color:var(--dark);
}
.review-date{
  font-size:.7rem;
  color:#999;
  margin-bottom:6px;
}
.review-text{
  font-size:.85rem;
  line-height:1.4;
}

/* FORM */
.form-box{
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  border-top:5px solid var(--gold);
}
.form-box h3{
  margin-top:0;
  text-align:center;
}
.form-box input,
.form-box textarea{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:6px;
  border:1px solid #ccc;
  font-family:inherit;
}
.form-box textarea{
  resize:none;
  height:100px;
}
.form-box button{
  width:100%;
  padding:12px;
  background:var(--gold);
  color:#fff;
  border:none;
  border-radius:6px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}
.form-box button:hover{
  background:var(--dark);
}

/* MOBILE */
@media(max-width:900px){
  .reviews-layout{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <h1>Отзывы клиентов</h1>
</header>

<main>
  <div class="reviews-layout">

    <!-- LEFT: REVIEWS -->
    <div class="reviews-box">
      <div id="reviews"></div>
    </div>

    <!-- RIGHT: FORM -->
    <div class="form-box">
      <h3>Оставить отзыв</h3>
      <input type="text" id="name" placeholder="Ваше имя">
      <textarea id="text" placeholder="Ваш отзыв"></textarea>
      <button onclick="addReview()">Отправить</button>
    </div>

  </div>
</main>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCpyJ-MJtaF9HnVBW-SXvrEafZOjEkXnOg",
  authDomain: "pro100molding-fd23c.firebaseapp.com",
  projectId: "pro100molding-fd23c",
  storageBucket: "pro100molding-fd23c.firebasestorage.app",
  messagingSenderId: "697790892100",
  appId: "1:697790892100:web:17492f565bbf6b90949411",
  measurementId: "G-N1616BE4FV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

  // === ВРЕМЕННО: добавить стартовые отзывы ===
async function seedReviews() {
  const reviews = [
    {
      name: "Александр К.",
      text: "Отличная работа по монтажу декоративных молдингов на стены. Геометрия идеальная, все углы сведены аккуратно. После покраски стены выглядят как в дизайнерском проекте.",
      createdAt: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)
    },
    {
      name: "Ирина В.",
      text: "Заказывали монтаж и покраску стеновых молдингов. Работа выполнена очень аккуратно, без спешки. Видно, что мастер понимает, что делает. Результат превзошёл ожидания.",
      createdAt: new Date(Date.now() - 5 * 24 * 60 * 60 * 1000)
    },
    {
      name: "Дмитрий С.",
      text: "Делали молдинги под покраску в гостиной. Все линии ровные, краска легла идеально. Стены стали выглядеть дорого и стильно. Однозначно рекомендую.",
      createdAt: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000)
    }
  ];

  for (const review of reviews) {
    await addDoc(collection(db, "reviews"), {
      ...review,
      createdAt: Timestamp.fromDate(review.createdAt)
    });
  }

  alert("Отзывы добавлены");
}

// ВЫЗОВ — один раз
 seedReviews();

const reviewsRef = collection(db, "reviews");

async function loadReviews(){
  const q = query(reviewsRef, orderBy("created","desc"));
  const snap = await getDocs(q);
  const box = document.getElementById("reviews");
  box.innerHTML = "";
  snap.forEach(doc=>{
    const r = doc.data();
    box.innerHTML += `
      <div class="review">
        <div class="review-name">${r.name}</div>
        <div class="review-date">${r.created?.toDate().toLocaleDateString()}</div>
        <div class="review-text">${r.text}</div>
      </div>`;
  });
}

window.addReview = async function(){
  const name = document.getElementById("name").value.trim();
  const text = document.getElementById("text").value.trim();
  if(!name || !text) return alert("Заполните все поля");

  await addDoc(reviewsRef,{
    name,
    text,
    created: serverTimestamp()
  });

  document.getElementById("name").value="";
  document.getElementById("text").value="";
  loadReviews();
}

loadReviews();
</script>

</body>
</html>
