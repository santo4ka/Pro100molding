<style>
/* === VARIABLES === */

    --gold:#c5a059;
    --dark:#1a1a1a;

}

/* === BASE === */
body{

    overflow-x:hidden;
}

/* === HEADER === */
.site-header{
    height:45vh;
    min-height:280px;
    display:flex;
    justify-content:center;

        url('https://images.unsplash.com/photo-1600585152220-90363fe7e115?auto=format&fit=crop&q=80&w=1200')

    border-bottom:5px solid var(--gold);
}

.site-logo{
    font-size:clamp(1.3rem,7vw,3.5rem);
    font-weight:900;

    margin:0;
}

.site-logo a{
    color:inherit;
    text-decoration:none;
}

.site-slogan{

    background:var(--gold);

}

/* === MAIN === */
main{
    max-width:1100px;
    margin:-30px auto 40px;
    padding:0 15px;
}

.content-block{
    background:var(--white);
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);

      <nav class="breadcrumbs">
    <a href="index.html" class="breadcrumb-link">← На главную</a>

}

h1{

}

.intro-text{

    color:var(--gray);
    border-left:2px solid #ddd;
    padding-left:15px;
}

/* === GALLERY === */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
    margin-top:25px;
}

.gallery-item{
    height:350px;
    overflow:hidden;
    border-radius:8px;
}

.gallery-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:zoom-in;
}

/* === FOOTER === */
footer{
    text-align:center;
    padding:40px 15px;
    background:var(--white);
}

.footer-text{
    font-size:0.8rem;
    color:#888;
}

.contact-grid{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.btn-contact{
    min-width:120px;
    padding:14px;
    color:#fff;
    font-weight:bold;
    border-radius:8px;
    text-decoration:none;
}

.footer-copy{
    margin-top:20px;
    font-size:0.7rem;
    color:#888;
    text-transform:uppercase;
}

/* === LIGHTBOX === */
.lightbox{
    position:fixed;
    inset:0;
    display:none;
    background:rgba(0,0,0,.9);
    align-items:center;
    justify-content:center;
    z-index:9999;
}
.lightbox img{
    max-width:95%;
    max-height:95%;
    border-radius:8px;
}
      /* Навигация: назад / дальше */
.breadcrumbs {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.breadcrumb-link {
    color: var(--gold);
    text-decoration: none;
    font-weight: bold;
    font-size: 0.8rem;

}

.breadcrumb-link:hover {

</style>

<!-- === SCHEMA === -->
<script type="application/ld+json">

</head>

<body>

<header class="site-header">
    <div>
        <p class="site-logo"><a href="index.html">PRO100MOLDING</a></p>
        <div class="site-slogan">Идеальные стыки и скрытый монтаж</div>
    </div>
</header>

<main>
    <div class="content-block">
        <h1>Монтаж напольного плинтуса</h1>
        <p class="intro-text">
            Идеальное примыкание к стенам. Работаем с МДФ, дюрополимером, деревом и алюминием.
        </p>

        <div class="gallery" id="plintus-gallery"></div>
    </div>
</main>
      <section class="next-sections">
    <p>Посмотрите также:</p>
    <div class="nav-links">
        <a href="molding.html" class="nav-link-item">Молдинги</a>
        <a href="decor.html" class="nav-link-item">Декор потолка</a>
    </div>
</section>


<footer>
    <p class="footer-text">Связаться со мной:</p>
    <div class="contact-grid">
        <a href="tel:+79264498797" class="btn-contact" style="background:var(--dark)">Позвонить</a>
        <a href="https://wa.me/79264498797" class="btn-contact" style="background:#25D366">WhatsApp</a>
        <a href="https://t.me/+79264498797" class="btn-contact" style="background:#0088cc">Telegram</a>
    </div>
    <div class="footer-copy">© 2026 PRO100MOLDING</div>
</footer>

<div class="lightbox" id="lightbox">
    <img id="lightbox-img" alt="">
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{

const gallery=document.getElementById('plintus-gallery');
const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightbox-img');

fetch('plintus-photos.json')
.then(r=>r.json())
.then(photos=>{
    photos.forEach((url,i)=>{
        const div=document.createElement('div');
        div.className='gallery-item';
        const img=document.createElement('img');
        img.src=url;
        img.loading='lazy';
        img.alt=`Монтаж напольного плинтуса PRO100MOLDING, фото ${i+1}`;
        img.onclick=()=>{
            lightboxImg.src=url;
            lightbox.style.display='flex';
            document.body.style.overflow='hidden';
        };
        div.appendChild(img);
        gallery.appendChild(div);
    });
});

lightbox.onclick=()=>{
    lightbox.style.display='none';
    document.body.style.overflow='';
};

});
</script>

</body>
</html>
